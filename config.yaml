# Main configuration file for AI News Ignite
# You can add more sections for other services as needed

env:
  openai:
    api_key: "${OPENAI_API_KEY}"
  github:
    token: "${GIT_PERSONAL_ACCESS_TOKEN}"
  langfuse:
    secret_key: "${LANGFUSE_SECRET_KEY}"
    public_key: "${LANGFUSE_PUBLIC_KEY}"
    host: "${LANGFUSE_HOST}"

app:
  input_message: >
    Research developments for an AI technical intelligence briefing aimed at an
    LLM engineer working on agents, evaluation, inference, and production
    infrastructure. Follow your selection criteria. Rank by technical
    significance. Return between the configured minimum and maximum, and return
    fewer when the window does not contain enough qualifying work.
  debug: true
  primary_window_days: 14
  fallback_window_days: 30
  min_findings: 5
  max_findings: 10

agents:
  initial_search:
    name: "initial_search_agent"
    prompt_key: "search_agent"
    debug: false
    model: "openai:gpt-6.1-terra"
  search_and_summarise:
    name: "search_and_summarise_agent"
    prompt_key: "summarise_agent"
    debug: false
    model: "openai:gpt-6.1-terra"
  github_assistant:
    name: "github_assistant"
    prompt_key: "github_agent"
    model: "openai:gpt-6.1-terra"
    debug: false
  supervisor:
    name: "supervisor"
    prompt_key: "supervisor_agent"
    model: "gpt-6.1-terra"
    debug: false

tool:
  github:
    docker_image: "ghcr.io/github/github-mcp-server"
    transport: "stdio"
  # model, reasoning, and include configure the research model.
  # type, search_context_size, and external_web_access are sent on the web_search tool.
  # tool_choice is not forced: the agent must still emit structured findings after searching.
  # return_token_budget is retained but not sent; web_search has no such parameter.
  openai_search_tools:
    model: "gpt-6.1-terra"
    type: "web_search"
    reasoning:
      effort: "medium"
    search_context_size: "high"
    external_web_access: true
    return_token_budget: "default"
    tool_choice: "required"
    include:
      - "web_search_call.action.sources"